[project]
name = "vela"
version = "0.1.0"
description = "Vela is a personal ETF rotation system for ETF rotation strategy research, signal generation, and backtesting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "tests",
]
pythonpath = [
    "packages/core/src",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
