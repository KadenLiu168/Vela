[project]
name = "vela"
version = "0.1.0"
description = "Vela is a personal ETF rotation system for ETF rotation strategy research, signal generation, and backtesting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.64",
    "alembic>=1.18.4",
    "numpy",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project.scripts]
vela = "vela_cli.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = [
    "apps/cli/src",
]

[tool.pytest.ini_options]
testpaths = [
    "apps/cli/tests",
    "packages/core/tests",
    "tests",
]
pythonpath = [
    "apps/cli/src",
    "packages/core/src",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
